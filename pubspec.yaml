name: vehicle_tracker
description: "Bitacora de Mantenimiento Automotriz"
publish_to: 'none'

# Para lanzar una actualización, cambia estos números (Ej. 1.0.1+2)
version: 1.0.0+4

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  path_provider: ^2.1.6
  provider: ^6.1.5+1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  intl: ^0.20.3
  fl_chart: ^1.2.0
  pdf: ^3.13.1
  printing: ^5.15.1
  file_picker: ^8.0.0
  open_filex: ^4.7.0
  flutter_local_notifications: 17.2.1
  shared_preferences: ^2.5.6

  # --- DEPENDENCIAS DE FIREBASE COMPATIBLES ---
  firebase_core: ^3.10.0
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.6.1
  google_sign_in: ^6.2.2
  firebase_crashlytics: ^4.3.10
  firebase_analytics: ^11.6.0
  uuid: ^4.6.0
  flutter_secure_storage: ^10.3.4
  url_launcher: ^6.3.3
  firebase_app_check: ^0.3.2+10
  purchases_flutter: ^10.19.0
  crypto: ^3.0.3
  unity_ads_plugin: ^0.5.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  isar_generator: ^3.1.0+1
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.13.1
  image: ^4.1.3

flutter:
  uses-material-design: true

  assets:
    - assets/logos/

# NUEVO: Configuración del logo de la app (Icono del Launcher)
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logos/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logos/app_icon.png"